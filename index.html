
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE LAST HALLOWEEN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090909;
      color: #e8e0e0;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 550px;
    }

    .date {
      color: #8d1b2a;
      font-size: 12px;
      letter-spacing: 5px;
    }

    h1 {
      color: #b80f2e;
      font-size: clamp(34px, 8vw, 60px);
      letter-spacing: 5px;
      margin: 30px 0 18px;
    }

    .subtitle {
      color: #999;
      line-height: 1.9;
    }

    button {
      background: transparent;
      color: #d51d3c;
      border: 1px solid #8b1026;
      padding: 15px 25px;
      margin-top: 30px;
      font-family: inherit;
      letter-spacing: 2px;
      cursor: pointer;
    }

    button:hover {
      background: #8b1026;
      color: white;
    }

    #message {
      color: #e32643;
      margin-top: 28px;
      line-height: 1.8;
    }

    .warning {
      color: #555;
      font-size: 10px;
      letter-spacing: 3px;
      margin-top: 60px;
    }
  </style>
</head>

<body>
  <main class="container">
    <p class="date">OCTOBER 31 · 11:59 PM</p>

    <h1>THE LAST<br>HALLOWEEN</h1>

    <p class="subtitle">
      Eight friends.<br>
      One house.<br>
      One person who should not be here.
    </p>

    <button onclick="revealMessage()">
      OPEN THE MESSAGE
    </button>

    <p id="message"></p>

    <p class="warning">DO NOT TRUST THE LAST ONLINE STATUS.</p>
  </main>

  <script>
    function revealMessage() {
      document.getElementById("message").innerText =
        "UNKNOWN: why are you celebrating without me?";
    }
  </script>
</body>
</html>
