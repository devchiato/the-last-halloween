
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE LAST HALLOWEEN</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #08080c;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 12px;
}

.phone {
  width: 100%;
  max-width: 390px;
  min-height: 720px;
  height: min(820px, 94vh);
  border: 3px solid #41414a;
  border-radius: 48px;
  overflow: hidden;
  position: relative;
  background:
    radial-gradient(ellipse at 50% 24%, #681626 0%, #25101b 32%, #09090d 72%);
  box-shadow: 0 0 50px #560b252b, inset 0 0 0 5px #111116;
}

.status {
  display: flex;
  justify-content: space-between;
  padding: 18px 27px 0;
  font-size: 13px;
  position: relative;
  z-index: 2;
}

.island {
  width: 100px;
  height: 27px;
  border-radius: 20px;
  background: #030305;
  margin: -24px auto 0;
}

.lock {
  text-align: center;
  padding: 42px 18px 0;
}

.date {
  color: #e7cbd1;
  font-size: 13px;
  letter-spacing: 1px;
}

.clock {
  font-size: 76px;
  font-weight: 200;
  letter-spacing: -3px;
  margin: 4px 0 18px;
}

.notice {
  margin: 0 15px;
  text-align: left;
  padding: 15px;
  border: 1px solid #ffffff20;
  border-radius: 22px;
  background: #211a23d9;
  backdrop-filter: blur(12px);
}

.notice small {
  color: #bdb1c3;
  float: right;
}

.notice p {
  margin-bottom: 0;
  line-height: 1.5;
  font-size: 14px;
}

.spacer {
  height: 28px;
}

.panel {
  margin: 0 12px;
  border: 1px solid #ffffff20;
  border-radius: 25px;
  background: #0c0b10eF;
  overflow: hidden;
}

.panel-head {
  text-align: center;
  padding: 15px;
  background: #1b1720;
  border-bottom: 1px solid #ffffff12;
}

.panel-head strong {
  display: block;
  font-size: 14px;
}

.panel-head small {
  color: #a59aaa;
}

.messages {
  padding: 15px 12px;
  min-height: 150px;
}

.sender {
  color: #b8a9c0;
  font-size: 11px;
  margin: 10px 0 5px 5px;
}

.bubble {
  width: fit-content;
  max-width: 90%;
  background: #292330;
  border-radius: 17px 17px 17px 5px;
  padding: 10px 13px;
  font-size: 13px;
  line-height: 1.5;
}

.mine {
  margin: 12px 0 0 auto;
  background: #74243d;
  border-radius: 17px 17px 5px 17px;
}

.actions {
  padding: 12px;
  display: grid;
  gap: 9px;
  border-top: 1px solid #ffffff14;
}

button {
  width: 100%;
  border: 1px solid #6e3348;
  background: #21141e;
  color: #f4e9ed;
  border-radius: 13px;
  padding: 12px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

button:active {
  background: #70213a;
}

.foot {
  text-align: center;
  color: #746474;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 18px 5px 24px;
}

.home {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 105px;
  height: 4px;
  border-radius: 5px;
  background: white;
}

.hidden { display: none; }

@media (max-height: 760px) {
  .phone { height: auto; min-height: 700px; }
  .lock { padding-top: 25px; }
  .clock { font-size: 62px; }
}
</style>
</head>

<body>
<main class="phone">
  <div class="status">
    <span>11:59</span>
    <span>● ● ▰</span>
  </div>

  <div class="island"></div>

  <section class="lock">
    <div class="date">SATURDAY, OCTOBER 31</div>
    <div class="clock">19:01</div>

    <div class="notice">
      <small>now</small>
      <strong>NO NAME</strong>
      <p>why are you celebrating without me?</p>
    </div>
  </section>

  <div class="spacer"></div>

  <section class="panel">
    <header class="panel-head">
      <strong>127 🎃</strong>
      <small>8 people · iMessage</small>
    </header>

    <div class="messages" id="messages">
      <div class="sender">Johnny</div>
      <div class="bubble">pada kesini jam berapa?</div>

      <div class="sender">Doyoung</div>
      <div class="bubble">bentar masih beli seblak</div>

      <div class="sender">Haechan</div>
      <div class="bubble">guys... who just texted me?</div>
    </div>

    <div class="actions">
      <button onclick="nextMessage()">OPEN UNKNOWN'S MESSAGE</button>
      <button onclick="showClue()">INVESTIGATE THE CLUE</button>
    </div>
  </section>

  <div class="foot">DO NOT TRUST THE LAST ONLINE STATUS.</div>
  <div class="home"></div>
</main>

<script>
let step = 0;

function nextMessage() {
  const messages = document.getElementById("messages");

  const story = [
    ["UNKNOWN", "I'm already inside the house."],
    ["Jaehyun", "Johnny... did you invite anyone else?"],
    ["UNKNOWN", "Mark, tell them what happened on October 30."],
    ["Taeyong", "Wait. Why is Mark's contact offline?"]
  ];

  if (step < story.length) {
    const [name, text] = story[step];

    const sender = document.createElement("div");
    sender.className = "sender";
    sender.textContent = name;

    const bubble = document.createElement("div");
    bubble.className = "bubble" +
      (name === "UNKNOWN" ? " mine" : "");
    bubble.textContent = text;

    messages.append(sender, bubble);
    step++;
  } else {
    alert("NEW MESSAGE: You have 1 unread message.");
  }
}

function showClue() {
  alert("CLUE 01\n\nOctober 30 — 11:47 PM\n\nAn accident report. One name keeps appearing: MARK LEE.\n\n[More evidence locked]");
}
</script>
</body>
</html>
