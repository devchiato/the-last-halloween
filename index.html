
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE LAST HALLOWEEN</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #111;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  color: white;
}

.phone {
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  min-height: 650px;
  margin: auto;
  position: relative;
  overflow: hidden;
  background: #222;
}

.wallpaper {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(#0002, #0001 45%, #0005),
    url("haechan-wallpaper.jpg") center / cover;
}

.status {
  position: absolute;
  top: 13px;
  left: 28px;
  right: 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  font-weight: 600;
  z-index: 5;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 5px;
}

.signal-icon {
  display: block;
  width: 17px;
  height: 14px;
}

.network {
  font-size: 12px;
  font-weight: 700;
  margin-right: 2px;
}

.battery {
  position: relative;
  display: flex;
  align-items: center;
  width: 25px;
  height: 12px;
  padding: 1.5px;
  margin-left: 1px;
  border: 1.5px solid white;
  border-radius: 3.5px;
  box-sizing: border-box;
}

.battery-level {
  display: block;
  width: 75%;
  height: 100%;
  background: white;
  border-radius: 1px;
}

.battery-cap {
  position: absolute;
  right: -3.5px;
  top: 3px;
  width: 2px;
  height: 4px;
  background: white;
  border-radius: 0 1px 1px 0;
}

.island {
  position: absolute;
  z-index: 6;
  width: 105px;
  height: 30px;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: #050505;
  border-radius: 20px;
}

.lock {
  position: absolute;
  inset: 0;
  text-align: center;
}

.date {
  position: absolute;
  top: 87px;
  width: 100%;
  font-size: 20px;
  font-weight: 500;
}

.clock {
  position: absolute;
  top: 108px;
  width: 100%;
  font-size: 100px;
  line-height: 1.1;
  font-weight: 200;
  letter-spacing: -5px;
}

.locked {
  position: absolute;
  top: 210px;
  width: 100%;
  font-size: 10px;
  letter-spacing: 2px;
  opacity: .8;
}

.notifications {
  position: absolute;
  top: 255px;
  left: 15px;
  right: 15px;
  display: grid;
  gap: 8px;
}

.notification {
  padding: 12px 14px;
  border-radius: 20px;
  background: rgba(245,245,250,.78);
  color: #222;
  text-align: left;
  border: 1px solid #ffffff55;
  backdrop-filter: blur(25px) saturate(160%);
  -webkit-backdrop-filter: blur(25px) saturate(160%);
}

.notif-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}


.imessage-icon {
  width: 25px;
  height: 25px;
  border-radius: 7px;
  background: #32c759;
  color: white;
  display: grid;
  place-items: center;
  position: relative;
}

.imessage-icon::before {
  content: "";
  width: 15px;
  height: 11px;
  background: white;
  border-radius: 50%;
  position: absolute;
}

.imessage-icon::after {
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  background: white;
  left: 6px;
  bottom: 6px;
  clip-path: polygon(100% 0, 0 100%, 100% 75%);
}

.sender {
  font-size: 12px;
  font-weight: 650;
  flex: 1;
}

.now {
  font-size: 10px;
  color: #777;
}

.message {
  padding-left: 33px;
  font-size: 13px;
  line-height: 1.4;
}

.slide {
  position: absolute;
  bottom: 12px;
  width: 100%;
  display: grid;
  justify-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 13px;
  text-shadow: 0 1px 5px #000;
}

.indicator {
  width: 135px;
  height: 5px;
  background: white;
  border-radius: 10px;
}

.screen {
  position: absolute;
  inset: 0;
  z-index: 3;
}

.hidden { display: none !important; }

.passcode {
  background: rgba(30,30,35,.55);
  backdrop-filter: blur(35px);
  -webkit-backdrop-filter: blur(35px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
}

.pass-title {
  font-size: 21px;
  font-weight: 600;
}

.pass-sub {
  font-size: 13px;
  opacity: .75;
  margin-bottom: 25px;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin: 25px 0;
}

.dot {
  width: 10px;
  height: 10px;
  border: 1px solid white;
  border-radius: 50%;
}

.dot.filled { background: white; }

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  justify-items: center;
  align-items: center;
  margin: auto;
}

.key {
  width: 80px;
  height: 80px;
  border: 0;
  border-radius: 50%;
  background: #ffffff25;
  color: white;
  font-size: 32px;
  font-weight: 300;
  margin: auto;
  cursor: pointer;
}

.key:active { background: #ffffff55; }

.key small {
  display: block;
  font-size: 12px;
  letter-spacing: 1px;
}

.error {
  height: 20px;
  font-size: 12px;
  margin-top: 10px;
}

.cancel {
  background: none;
  border: none;
  color: white;
  margin-top: 8px;
  cursor: pointer;
}

/* HOME SCREEN DAN WIDGET */
.home {
  padding: 30px 20px 120px;
  background: linear-gradient(#0001,#0002);
}

.home-widgets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 25px 0 28px;
}

.weather-widget, .clock-widget {
  min-height: 145px;
  border-radius: 23px;
  padding: 15px 13px;
  background: #ffffff30;
  border: 1px solid #ffffff24;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 8px 25px #0002;
}

.widget-city { font-size: 13px; }

.widget-temp {
  font-size: 34px;
  font-weight: 300;
  white-space: nowrap;
  letter-spacing: -1px;
}

.widget-temp span { font-size: 20px; }

.widget-condition, .widget-range {
  font-size: 10px;
  margin-top: 5px;
}

.widget-range { opacity: .85; }

.clock-widget {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.widget-time {
  font-size: 30px;
  font-weight: 650;
  letter-spacing: -1px;
}

.widget-day {
  font-size: 18px;
  font-weight: 600;
  margin-top: 9px;
}

/* GRID APLIKASI */
.apps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 19px 8px;
}

.app {
  border: 0;
  padding: 0;
  background: none;
  color: white;
  display: grid;
  justify-items: center;
  gap: 5px;
  cursor: pointer;
}

/* IKON STYLE IOS */
.icon {
  width: 64px;
  height: 64px;
  border-radius: 17px;
  display: grid;
  place-items: center;
  overflow: hidden;
  position: relative;
  box-shadow: 0 3px 7px #0003, inset 0 1px 1px #ffffff70;
  background: #f7f7fa;
}

.icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.icon.messages, .icon.phone-icon {
  background: linear-gradient(155deg,#65ed73,#08b928 70%,#079d25);
}

.icon.notes {
  background: linear-gradient(#ffd84b 0 27%,#fff 27%);
}

.icon.reminders, .icon.gmail, .icon.photos {
  background: #fff;
}

.icon.music {
  background: linear-gradient(145deg, #ff5c83, #c90055);
}

.icon.music svg {
  width: 100%;
  height: 100%;
  display: block;
}

.icon.camera {
  background: linear-gradient(145deg,#f2f2f2,#b7bbc1);
}

.icon.weather {
  background: linear-gradient(145deg,#52c8ff,#1978e8);
}

.icon.instagram {
  background: linear-gradient(135deg,#ffd76a,#fa3a75 48%,#7638d7);
}

.icon.safari {
  background: linear-gradient(145deg,#6be2ff,#0879df);
}

.app-name {
  font-size: 10px;
  text-shadow: 0 1px 4px #000;
}

/* DOCK */
.dock {
  position: absolute;
  bottom: 25px;
  left: 13px;
  right: 13px;
  height: 88px;
  border-radius: 28px;
  background: #ffffff35;
  border: 1px solid #ffffff30;
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  display: grid;
  grid-template-columns: repeat(4,1fr);
  align-items: center;
}

.dock .icon {
  width: 51px;
  height: 51px;
}

.dock .app-name { display: none; }

/* HALAMAN APLIKASI */
.app-page {
  position: absolute;
  inset: 0;
  z-index: 8;
  background: #f2f2f7;
  color: #111;
  padding: 55px 20px 30px;
}

.app-page.dark {
  background: #000;
  color: white;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.app-header h2 { font-size: 22px; }

.back {
  border: 0;
  background: none;
  color: #1687ff;
  font-size: 16px;
  cursor: pointer;
}

.chat {
  padding: 13px 0;
  border-bottom: 1px solid #8884;
  cursor: pointer;
}

.preview {
  font-size: 13px;
  opacity: .65;
  margin-top: 5px;
}

.bubble {
  background: #e5e5ea;
  color: #111;
  padding: 10px 14px;
  border-radius: 18px;
  margin: 10px 0;
  width: fit-content;
  max-width: 85%;
  font-size: 14px;
}

.mine {
  background: #0a84ff;
  color: white;
  margin-left: auto;
}

@media (min-width: 600px) {
  body { padding: 20px; }

  .phone {
    height: min(900px, calc(100dvh - 40px));
    border: 7px solid #333;
    border-radius: 45px;
  }
}


/* APPLE NOTES — iOS STYLE */

.app-page:has(.notes-screen) {
  background: #f2f2f7;
  color: #1c1c1e;
  padding: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.app-page:has(.notes-screen) .app-header {
  display: none;
}

.notes-screen {
  position: relative;
  min-height: 100%;
  padding: 60px 22px 100px;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.notes-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 28px;
}

.notes-folder,
.notes-more {
  border: 0;
  background: transparent;
  color: #ff9f0a;
  font: inherit;
  font-size: 17px;
  cursor: pointer;
  padding: 0;
}

.notes-folder {
  letter-spacing: -0.3px;
}

.notes-more {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 1px;
  padding: 0 3px;
}

.notes-title {
  font-size: 34px;
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: 0.2px;
  margin: 27px 0 20px;
  color: #1c1c1e;
}

.notes-search {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 10px;
  margin-bottom: 28px;
  border-radius: 10px;
  background: #e3e3e8;
  color: #8e8e93;
  font-size: 17px;
}

.notes-search span:first-child {
  font-size: 21px;
  line-height: 1;
}

.notes-section h4 {
  margin: 0 0 8px;
  color: #8e8e93;
  font-size: 13px;
  font-weight: 400;
}

.note-item {
  padding: 13px 0 14px;
  border-bottom: 0.5px solid #c6c6c8;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.note-title {
  margin-bottom: 3px;
  color: #1c1c1e;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.3;
}

.note-meta,
.note-preview {
  margin-top: 3px;
  color: #8e8e93;
  font-size: 13px;
  line-height: 1.35;
}

.note-preview {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.previous-notes {
  margin-top: 27px;
}

.notes-compose {
  position: fixed;
  bottom: 38px;
  right: max(calc((100% - 430px) / 2 + 24px), 24px);
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: #f2f2f7;
  color: #ff9f0a;
  font-size: 31px;
  font-weight: 400;
  cursor: pointer;
  z-index: 10;
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>

<body>
<main class="phone">
  <div class="wallpaper"></div>

  <div class="status">
    <span class="status-time">19:00</span>

    <div class="status-icons">

  <!-- HOME SCREEN -->

<!-- MUSIC -->

      <!-- PHOTOS -->

      <!-- CAMERA -->
      <button class="app" data-app="Camera">
        <span class="icon camera">
          <svg viewBox="0 0 100 100">
            <rect x="12" y="27" width="76" height="54" rx="12" fill="#25272b"/>

            <circle cx="52" cy="54" r="12" fill="#27394a" stroke="#9bb8cf" stroke-width="3"/>
            <circle cx="76" cy="36" r="3" fill="#ffd60a"/>
          </svg>

        <span class="app-name">Camera</span>

      <!-- WEATHER -->
      <button class="app" data-app="Weather">
        <span class="icon weather">
          <svg viewBox="0 0 100 100">
            <circle cx="65" cy="30" r="18" fill="#ffd60a"/>
            <path d="M23 70a18 18 0 0 1 34-8 17 17 0 0 1 25 14 13 13 0 0 1-13 13H30a15 15 0 0 1-7-19z" fill="#fff"/>
          </svg>
        </span>
        <span class="app-name">Cuaca</span>
      </button>

      <!-- INSTAGRAM -->
      <button class="app" data-app="Instagram">
        <span class="icon instagram">
          <svg viewBox="0 0 100 100">
            <rect x="22" y="22" width="56" height="56" rx="17" fill="none" stroke="#fff" stroke-width="7"/>
            <circle cx="50" cy="50" r="14" fill="none" stroke="#fff" stroke-width="7"/>
            <circle cx="68" cy="32" r="4" fill="#fff"/>

        </span>
        <span class="app-name">Instagram</span>
      </button>
    </div>

    <!-- DOCK -->
    <div class="dock">

      <button class="app" data-app="Safari">
        <span class="icon safari">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="39" fill="#fff"/>

            <path d="M65 29L55 55 34 70 44 44z" fill="#ff453a"/>

          </svg>
        </span>
        <span class="app-name">iMessage</span>

      <button class="app" data-app="Apple Music">
        <span class="icon music">
         <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="appleMusicBg"
          x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff5c83"/>
          <stop offset="50%" stop-color="#fa174f"/>
          <stop offset="100%" stop-color="#c90055"/>
        </linearGradient>
      </defs>

      <rect width="100" height="100" rx="22"
        fill="url(#appleMusicBg)"/>

      <path
        d="M64 20
           L80 16
           Q83 15 83 19
           L83 65
           C83 74 76 80 67 80
           C60 80 55 76 55 69
           C55 62 62 57 70 57
           C73 57 76 58 78 60
           L78 30
           L65 33
           L65 69
           C65 78 58 84 49 84
           C42 84 37 80 37 73
           C37 66 44 61 52 61
           C55 61 58 62 60 64

    <div class="indicator" style="position:absolute;bottom:7px;left:50%;transform:translateX(-50%)"></div>
  </section>

  <!-- HALAMAN APLIKASI -->
  <section class="app-page hidden" id="appPage">
    <div class="app-header">
      <button class="back" id="back">‹ Home</button>
      <h2 id="appTitle">Messages</h2>
      <span></span>
    </div>
    <div id="appContent"></div>
  </section>
</main>

<script>
const lock = document.getElementById("lock");
const pass = document.getElementById("pass");
const home = document.getElementById("home");
const appPage = document.getElementById("appPage");
let code = "";

function openPasscode() {
  lock.classList.add("hidden");
  pass.classList.remove("hidden");
}

document.getElementById("slide").addEventListener("click", openPasscode);

let startY = 0;

lock.addEventListener("touchstart", e => {
  startY = e.touches[0].clientY;
}, {passive:true});

lock.addEventListener("touchend", e => {
  if (startY - e.changedTouches[0].clientY > 35) {
    openPasscode();
  }
}, {passive:true});

function updateDots() {
  document.querySelectorAll(".dot").forEach((dot, i) => {
    dot.classList.toggle("filled", i < code.length);
  });
}

document.querySelectorAll("[data-num]").forEach(button => {
  button.addEventListener("click", () => {
    if (code.length >= 4) return;

    code += button.dataset.num;
    updateDots();

    if (code.length === 4) {
      if (code === "0127") {
        setTimeout(() => {
          pass.classList.add("hidden");
          home.classList.remove("hidden");
        }, 200);
      } else {
        document.getElementById("error").textContent =
          "Incorrect passcode";

        setTimeout(() => {
          code = "";
          updateDots();
          document.getElementById("error").textContent = "";
        }, 800);
      }
    }
  });
});

document.getElementById("cancel").addEventListener("click", () => {
  pass.classList.add("hidden");
  lock.classList.remove("hidden");
  code = "";
  updateDots();
});

const appContent = document.getElementById("appContent");

function openApp(name) {
  home.classList.add("hidden");
  appPage.classList.remove("hidden");

  appPage.classList.toggle(
    "dark",
    ["Messages", "Apple Music", "Camera", "Phone"].includes(name)
  );

  document.getElementById("appTitle").textContent = name;
  appContent.innerHTML = "";

  if (name === "Messages") {
    appContent.innerHTML = `
      <div class="chat" onclick="openChat('mark')">
        <b>Mark Lee</b>
        <div class="preview">bentar ya abis ini otw jemput</div>
      </div>
      <div class="chat" onclick="openChat('group')">
        <b>TONGKRONGAN ASIK</b>
        <div class="preview">Bang Doyoung: bentarrrrr</div>
      </div>`;
 
} else if (name === "Notes") {
  appContent.innerHTML = `
    <div class="notes-screen">

      <div class="notes-topbar">
        <button class="notes-folder">‹ Folders</button>
        <button class="notes-more">•••</button>
      </div>

      <h1 class="notes-title">Notes</h1>

      <div class="notes-search">
        <span>⌕</span>
        <span>Search</span>
      </div>

      <div class="notes-section">
        <h4>Today</h4>

        <div class="note-item" onclick="openNote('today')">
          <div class="note-title">Halloween 🎃</div>
          <div class="note-meta">7:00 PM</div>
          <div class="note-preview">
            31 October · Ke rumah Johnny...
          </div>
        </div>
      </div>

      <div class="notes-section previous-notes">
        <h4>Previous 30 Days</h4>

        <div class="note-item" onclick="openNote('note1')">
          <div class="note-title">Untitled</div>
          <div class="note-meta">Oct 29</div>
          <div class="note-preview">...</div>
        </div>

        <div class="note-item" onclick="openNote('note2')">
          <div class="note-title">Untitled</div>
          <div class="note-meta">Oct 27</div>
          <div class="note-preview">...</div>
        </div>

        <div class="note-item" onclick="openNote('note3')">
          <div class="note-title">Untitled</div>
          <div class="note-meta">Oct 25</div>
          <div class="note-preview">...</div>
        </div>

        <div class="note-item" onclick="openNote('note4')">
          <div class="note-title">Untitled</div>
          <div class="note-meta">Oct 23</div>
          <div class="note-preview">...</div>
        </div>
      </div>

      <button class="notes-compose"
        onclick="openNote('new')">✎</button>

    </div>
      `;
  } else if (name === "Reminders") {
    appContent.innerHTML =
      "<p>◯ Jemput Haechan</p><p>◯ Halloween party</p>";
  } else if (name === "Gmail") {
    appContent.innerHTML =
      "<h3>Security alert</h3><p>A sign-in was detected on October 30.</p>";
  } else if (name === "Weather") {
    appContent.innerHTML =
      "<h1>🌙 19°</h1><p>Clear night</p>";
  } else if (name === "Photos") {
    appContent.innerHTML =
      "<h3>Recents</h3><p>Some memories are better left unopened.</p>";
  } else if (name === "Instagram") {
    appContent.innerHTML =
      "<h3>haechan</h3><p>halloween night 🎃</p>";
  } else if (name === "Apple Music") {
    appContent.innerHTML =
      "<h3>♫ Night Drive</h3><p>Unknown Artist</p>";
  } else if (name === "Camera") {
    appContent.innerHTML = "<h1>📷</h1><p>Camera</p>";
  } else if (name === "Phone") {
    appContent.innerHTML =
      "<h3>Recents</h3><p>Johnny · 18:42</p><p>Mark Lee · No answer</p>";
  } else if (name === "Safari") {
    appContent.innerHTML =
      "<h3>Search</h3><p>mark lee accident october 30</p>";
  }
}

function openChat(which) {
  document.getElementById("appTitle").textContent =
    which === "mark" ? "Mark Lee" : "TONGKRONGAN ASIK";

  appContent.innerHTML = which === "mark" ? `
    <div class="bubble">bentar ya abis ini otw jemput</div>
    <div class="bubble mine">oke, hati-hati</div>
    <p style="text-align:center;font-size:12px;opacity:.6">
      Mark Lee is not online
    </p>` : `
    <div class="bubble">Bang Johnny: pada kesini jam berapa?</div>
    <div class="bubble">Bang Doyoung: bentarrrrr</div>
    <div class="bubble mine">otw bentar lagi</div>`;
}

document.querySelectorAll("[data-app]").forEach(button => {
  button.addEventListener("click", () => openApp(button.dataset.app));
});

document.getElementById("back").addEventListener("click", () => {
  appPage.classList.add("hidden");
  home.classList.remove("hidden");
});
</script>
</body>
</html>
